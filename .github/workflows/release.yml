name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run check

      - name: Check tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # npm trusted publishing (OIDC) with direct publish: tags release
      # automatically, no long-lived token and no manual approval.
      # Trusted publisher config on npmjs.com: GitHub Actions ->
      # Cle2ment / opencode-deepseek-search-fetch / release.yml
      # with "npm publish" allowed.
      # Provenance attestation is disabled for now: sigstore tlog fails with
      # 409 TLOG_CREATE_ENTRY_ERROR for this package (2026-10-28). OIDC auth is
      # unaffected. Re-enable by removing NPM_CONFIG_PROVENANCE and adding
      # --provenance back once the registry/sigstore issue is resolved.
      - name: Publish to npm
        run: npm stage publish --access public
        env:
          NPM_CONFIG_PROVENANCE: "false"

  smoke:
    # Optional real-API smoke test against DeepSeek (not the npm package);
    # runs after publishing, only when DEEPSEEK_API_KEY is configured.
    needs: publish
    if: ${{ vars.DEEPSEEK_SMOKE_TEST == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Smoke test Search and Fetch APIs
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: bun run test/smoke.ts
