name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run check

      - name: Check tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # npm trusted publishing (OIDC) with staged publishing: CI can only stage
      # a release; a maintainer approves it with 2FA to make it public.
      # Trusted publisher config on npmjs.com: GitHub Actions ->
      # Cle2ment / opencode-deepseek-search-fetch / release.yml
      # (stage-only, i.e. leave "npm publish" unchecked).
      - name: Stage release on npm
        run: npm stage publish --access public

  smoke:
    # Optional real-API smoke test against DeepSeek (not the npm package);
    # runs after staging, only when DEEPSEEK_API_KEY is configured.
    needs: publish
    if: ${{ vars.DEEPSEEK_SMOKE_TEST == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Smoke test Search and Fetch APIs
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: bun run test/smoke.ts
